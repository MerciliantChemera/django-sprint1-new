{% extends "base.html" %}
{% load static %}

{% block title %}
  <title>
    {{ title }}
  </title>
{% endblock %}

{% block content %}
  <div class="container py-5">
    <h1>
      {{ title }}
    </h1>
    <hr>
    <article>
      <ul>
        <li>
          Место: {{ post.location }}
        </li>
        <li>
          Дата: {{ post.date }}
        </li>
        <li>
          Категория: 
          <a href="{% url 'blog:category' post.category %}">
              {{ post.category }}
          </a>
        </li>
      </ul>
      <p>
        {{ post.text|truncatewords:10 }}
      </p>
      <a href="{% url 'blog:post_detail' post.id %}">
        Читать полный текст
      </a>
    </article>
  </div>
{% endblock%}
